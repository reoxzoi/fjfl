name: Deploy Vue3 App to GitHub Pages

on:
  # 当 push 到 main 分支时触发（如果你默认分支是 master，请改成 master）
  push:
    branches: [ main ]
  # 允许在 GitHub 网页上手动点击运行
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许 Actions 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，排队处理
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: 'npm' # 或者 'pnpm' / 'yarn'，根据你的包管理器修改

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci # 如果是 pnpm 用 pnpm install --frozen-lockfile

      - name: Build
        run: npm run build # 如果是 pnpm 用 pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Vite 默认打包输出目录是 dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4